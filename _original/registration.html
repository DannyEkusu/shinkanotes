        <h1>ShinkaNotes</h1>
        <h2>Welcome New User!</h2>
        <h3>Please fill out the form below:</h3>
        <form id="registration-form" method="get" enctype="multipart/form-data" novalidate>
            <p><label for="fullname">Full Name <span aria-hidden="true">*</span></label><input type="text" id="fullname" name="fullname" required minlength="2" maxlength="100" placeholder="Your name" autocomplete="name"></p>
            <p><label for="email">Email </label><input type="email" id="email" name="email" required placeholder="Your email here" autocomplete="email"></p>
            <p><label for="confirm-password">Password </label><input type="password" name="confirm-password" id="confirm-password" required minlength="8" autocomplete="new-password"></p>          
            <button type="submit">Continue</button>

        </form>


        <script src="main.js"></script>
    </body>
