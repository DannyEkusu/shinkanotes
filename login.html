<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="main.css">
</head>
<body data-page="login" data-access="public">
<!-- main.js adds the topbar, sidebar and footer around #app on every page. -->
<main id="app" class="container">
<h1>Sign in</h1>
<p class="notice">Prototype: this sign-in only works on the device where you created your account and is not secure authentication. Real private accounts need a backend.</p>
<form id="login-form" class="card"><label>Email<input id="login-email" type="email" required autocomplete="email"></label>
<label>Password<input id="login-password" type="password" required autocomplete="current-password"></label>
<p id="login-error" class="error" role="alert"></p><button class="btn">Sign in</button>
<p class="small">New here? <a href="registration.html">Create an account</a></p></form></main>
<script src="main.js"></script>
</body>
</html>
